[package]
name = "ams2-u0-ui-spike"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Throwaway spike: its own workspace root, so the real workspace (and its fmt/clippy/test
# runs) never sees it.
[workspace]

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
tray-icon = "0.26"
muda = "0.21"
serde_json = "1"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi", "Win32_System_Registry"] }

[profile.release]
lto = "thin"
codegen-units = 1
