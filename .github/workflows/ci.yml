name: ci

# Minutes are limited (free organisation, Windows counts double): CI runs by hand only
# (Actions > ci > Run workflow); every check runs locally before each merge (README, "Building").
# It runs on the organisation's own Windows runner `stintmate-win` (no GitHub minutes; private
# repositories and workflow_dispatch only); `windows-latest` is the fallback when it is down.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [stintmate-win, windows-latest]
        default: stintmate-win

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start, and the runner takes one job at a time.
  ci:
    runs-on: ${{ inputs.runner == 'windows-latest' && 'windows-latest' || fromJSON('["self-hosted", "stintmate-win"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner tools
        shell: bash
        run: |
          for t in bash gzip zstd tar ssh ssh-agent git; do printf '%-10s %s\n' "$t" "$(command -v $t)"; done
          echo "HOME=$HOME"
          ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
      # stintmate-ipc is a private repository: a read-only deploy key (secret
      # STINTMATE_IPC_DEPLOY_KEY) in ssh-agent, git over SSH for that one URL; cargo uses the git CLI.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.STINTMATE_IPC_DEPLOY_KEY }}
      - name: Fetch stintmate-ipc over SSH
        shell: bash
        run: |
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          git config --global url."git@github.com:Stintmate-App/stintmate-ipc".insteadOf "https://github.com/Stintmate-App/stintmate-ipc"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Real-time tests skip themselves on GitHub's shared runners (they run on ours).
          STINTMATE_SHARED_RUNNER: ${{ runner.environment == 'github-hosted' && '1' || '' }}
          # No CI runner has a desktop with OpenGL (ours runs as a service): the window's test skips.
          STINTMATE_NO_DESKTOP: "1"
      # cargo-deny: installed on stintmate-win; GitHub's runner installs it here.
      - if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources
      # The installer (dev flavour; cargo deny ran above): release build, notices, Inno Setup 6.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: ./scripts/build-installer.ps1 -Dev -SkipDeny
      - uses: actions/upload-artifact@v4
        with:
          name: ams2-connector-dev-setup
          path: dist/AMS2-Connector-*-dev-setup.exe*
          retention-days: 7
