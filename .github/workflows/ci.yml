name: ci

# Runs on every pull request to main (a required check of main's ruleset) and by hand
# (Actions > ci > Run workflow). The same checks run locally through the hooks in .githooks/.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start.
  ci:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner tools
        shell: bash
        run: |
          for t in bash gzip zstd tar git; do printf '%-10s %s\n' "$t" "$(command -v $t)"; done
          echo "HOME=$HOME"
          ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Real-time tests skip themselves on GitHub's shared runners.
          STINTMATE_SHARED_RUNNER: "1"
          # No CI runner has a desktop with OpenGL: the window's test skips.
          STINTMATE_NO_DESKTOP: "1"
      # cargo-deny, from a prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources
      # The installer (dev flavour; cargo deny ran above): release build, notices, Inno Setup 6.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: ./scripts/build-installer.ps1 -Dev -SkipDeny
      - uses: actions/upload-artifact@v4
        with:
          name: ams2-connector-dev-setup
          path: dist/AMS2-Connector-*-dev-setup.exe*
          retention-days: 7
