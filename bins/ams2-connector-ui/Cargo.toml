[package]
name = "ams2-connector-ui"
description = "The AMS2 connector's control app: the recorder's supervision, the control endpoint and the UI's in-process API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "ams2_connector_ui"
path = "src/lib.rs"

[dependencies]
ams2-platform.workspace = true
ams2-shm.workspace = true
ams2-i18n.workspace = true
stintmate-ipc.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
stintmate-ipc-check.workspace = true
