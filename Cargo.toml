[workspace]
resolver = "3"
members = [
    "crates/ams2-shm",
    "crates/ams2-core",
    "crates/ams2-platform",
    "crates/ams2-i18n",
    "bins/ams2-recorder",
    "bins/ams2-connector-ui",
    "bins/ams2-connector-window",
    "tools/replay",
    "tools/measure",
    "tools/golden",
]

[workspace.package]
version = "3.2.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/ams2-connector"
authors = ["The Stintmate authors"]
publish = false

[workspace.dependencies]
ams2-shm = { path = "crates/ams2-shm" }
ams2-core = { path = "crates/ams2-core" }
ams2-platform = { path = "crates/ams2-platform" }
ams2-i18n = { path = "crates/ams2-i18n" }
ams2-connector-ui = { path = "bins/ams2-connector-ui" }
# The IPC library, pinned to a release tag like any dependency (CI reads the private repository
# with a read-only deploy key: .github/workflows/ci.yml).
stintmate-ipc = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.0" }
stintmate-ipc-check = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.0" }
windows-sys = "0.61"
zerocopy = { version = "0.8", features = ["derive", "alloc"] }
thiserror = "2"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
criterion = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
tracing-appender = "0.2"
tempfile = "3"
rmp-serde = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols stripped from release binaries; unwinding stays (no panic = "abort"): a panic in a
# thread is caught and logged by the panic hook.
strip = "symbols"
