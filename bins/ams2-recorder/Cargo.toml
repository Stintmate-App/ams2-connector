[package]
name = "ams2-recorder"
description = "The AMS2 recorder: reads the game at 50 Hz and records through Pitwall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "ams2_recorder"
path = "src/lib.rs"

[dependencies]
ams2-shm.workspace = true
ams2-core.workspace = true
ams2-platform.workspace = true
stintmate-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# `capture-raw`: record the game's frames to a file for test fixtures (decision D13: dev builds
# only; a user never runs it by accident).
capture-raw = []
