name: ci

# Minutes are limited (free organisation, Windows counts double): CI runs by hand only
# (Actions > ci > Run workflow); every check runs locally before each merge (README, "Building").
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # stintmate-ipc is a private repository: a read-only deploy key (secret
      # STINTMATE_IPC_DEPLOY_KEY) and git over SSH for that one URL; cargo uses the git CLI.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.STINTMATE_IPC_DEPLOY_KEY }}
      - name: Fetch stintmate-ipc over SSH
        shell: bash
        run: |
          git config --global url."git@github.com:Stintmate-App/stintmate-ipc".insteadOf "https://github.com/Stintmate-App/stintmate-ipc"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Real-time and desktop tests skip themselves on shared GitHub-hosted runners.
          STINTMATE_SHARED_RUNNER: ${{ runner.environment == 'github-hosted' && '1' || '' }}

  deny:
    # The cargo-deny binary (not its Docker action: the container would not see the SSH agent).
    # The graph is Windows' (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stintmate-ipc is a private repository: a read-only deploy key (secret
      # STINTMATE_IPC_DEPLOY_KEY) and git over SSH for that one URL; cargo uses the git CLI.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.STINTMATE_IPC_DEPLOY_KEY }}
      - name: Fetch stintmate-ipc over SSH
        shell: bash
        run: |
          git config --global url."git@github.com:Stintmate-App/stintmate-ipc".insteadOf "https://github.com/Stintmate-App/stintmate-ipc"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources
