[workspace]
resolver = "3"
members = [
    "crates/ams2-shm",
    "crates/ams2-core",
    "crates/ams2-platform",
    "crates/ams2-i18n",
    "bins/ams2-recorder",
    "bins/ams2-connector-ui",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/ams2-connector"
authors = ["The Stintmate authors"]
publish = false

[workspace.dependencies]
ams2-shm = { path = "crates/ams2-shm" }
ams2-core = { path = "crates/ams2-core" }
ams2-platform = { path = "crates/ams2-platform" }
ams2-i18n = { path = "crates/ams2-i18n" }
# Moves to `tag = "v0.2.0"` at PRY-085 cutover.
stintmate-ipc = { git = "https://github.com/Stintmate-App/stintmate-ipc", rev = "b7565cc" }
windows-sys = "0.61"
zerocopy = { version = "0.8", features = ["derive", "alloc"] }
thiserror = "2"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
criterion = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
tracing-appender = "0.2"
tempfile = "3"
rmp-serde = "1"

[profile.release]
lto = "thin"
codegen-units = 1
